<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Applications - AI Matcher</title>

    <link rel="stylesheet" href="style.css">

    <style>

        body {
            background: #f5f7fb;
        }

        .applications-page {
            max-width: 1200px;
            margin: 45px auto;
            padding: 20px;
        }

        .applications-header {
            text-align: center;
            margin-bottom: 35px;
        }

        .applications-header h1 {
            margin-bottom: 8px;
            font-size: 34px;
            color: #222;
        }

        .applications-header p {
            color: #666;
            font-size: 16px;
        }

        #applicationsContainer {
            display: grid;
            grid-template-columns:
                repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
        }

        .application-card {
            background: white;
            border-radius: 16px;
            padding: 25px;
            box-shadow:
                0 6px 22px rgba(0, 0, 0, 0.08);
            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }

        .application-card:hover {
            transform: translateY(-5px);

            box-shadow:
                0 10px 28px rgba(0, 0, 0, 0.12);
        }

        .application-card h2 {
            margin: 0 0 12px 0;
            font-size: 21px;
            color: #222;
        }

        .company-name {
            color: #4f46e5;
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 20px;
        }

        .application-id {
            display: inline-block;
            background: #f3f4f6;
            color: #374151;
            padding: 7px 12px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 18px;
        }

        .status-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 14px;
            background: #f0fdf4;
            border-radius: 10px;
            margin-bottom: 18px;
        }

        .status-label {
            color: #166534;
            font-weight: 600;
        }

        .status-badge {
            background: #22c55e;
            color: white;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
        }

        .success-message {
            color: #666;
            line-height: 1.6;
            margin-bottom: 0;
        }

        .login-card,
        .empty-card,
        .error-card {
            grid-column: 1 / -1;
            background: white;
            border-radius: 16px;
            padding: 40px;
            text-align: center;
            box-shadow:
                0 6px 22px rgba(0, 0, 0, 0.08);
        }

        .login-card h2,
        .empty-card h2,
        .error-card h2 {
            margin-bottom: 12px;
        }

        .login-card p,
        .empty-card p,
        .error-card p {
            color: #666;
            margin-bottom: 22px;
        }

        .action-btn {
            display: inline-block;
            padding: 12px 22px;
            border-radius: 8px;
            text-decoration: none;
            background: #4f46e5;
            color: white;
            font-weight: 600;
        }

        .action-btn:hover {
            opacity: 0.9;
        }

        @media (max-width: 600px) {

            .applications-page {
                margin: 25px auto;
                padding: 15px;
            }

            .applications-header h1 {
                font-size: 28px;
            }

            #applicationsContainer {
                grid-template-columns: 1fr;
            }

            .application-card {
                padding: 20px;
            }

            .status-row {
                flex-direction: column;
                align-items: flex-start;
            }

        }

    </style>

</head>


<body>


<header>

    <div class="logo">
        AI Matcher
    </div>

    <nav>

        <a href="index.html">
            Home
        </a>

        <a href="dashboard.html">
            Internships
        </a>

        <a href="projects.html">
            Projects
        </a>

        <a href="profile-view.html">
            Profile
        </a>

    </nav>

</header>


<main class="applications-page">


    <div class="applications-header">

        <h1>
            My Applications
        </h1>

        <p>
            Track your internship applications
            and application status.
        </p>

    </div>


    <div id="applicationsContainer">

        <div class="empty-card">

            <h2>
                Loading Applications...
            </h2>

            <p>
                Please wait while we fetch
                your applications.
            </p>

        </div>

    </div>


</main>


<script>


async function loadApplications() {


    const container =
        document.getElementById(
            "applicationsContainer"
        );


    const studentId =
        localStorage.getItem(
            "studentId"
        );


    if (!studentId) {

        container.innerHTML = `

            <div class="login-card">

                <h2>
                    Please Login
                </h2>

                <p>
                    Login to view your internship
                    applications.
                </p>

                <a
                    href="login.html"
                    class="action-btn"
                >
                    Login
                </a>

            </div>

        `;

        return;

    }


    try {


        const response =
            await fetch(

                "http://127.0.0.1:8000/student/"
                + studentId
                + "/applications"

            );


        if (!response.ok) {

            throw new Error(
                "HTTP Error: "
                + response.status
            );

        }


        const applications =
            await response.json();


        console.log(
            "Applications:",
            applications
        );


        container.innerHTML = "";


        if (
            !Array.isArray(applications)
            ||
            applications.length === 0
        ) {


            container.innerHTML = `

                <div class="empty-card">

                    <h2>
                        No Applications Yet
                    </h2>

                    <p>
                        You have not applied to
                        any internships yet.
                    </p>

                    <a
                        href="dashboard.html"
                        class="action-btn"
                    >
                        Find Internships
                    </a>

                </div>

            `;

            return;

        }


        applications.forEach(
            function(application) {


                const card =
                    document.createElement(
                        "div"
                    );


                card.className =
                    "application-card";


                card.innerHTML = `

                    <h2>
                        ${
                            application.internship_title
                            || "Internship"
                        }
                    </h2>


                    <div class="company-name">

                        ${
                            application.company
                            || "Company"
                        }

                    </div>


                    <div class="application-id">

                        Application ID:
                        ${
                            application.application_id
                        }

                    </div>


                    <div class="status-row">

                        <span class="status-label">

                            Application Status

                        </span>


                        <span class="status-badge">

                            ${
                                application.status
                                || "Applied"
                            }

                        </span>

                    </div>


                    <p class="success-message">

                        Your application has been
                        submitted successfully.

                    </p>

                `;


                container.appendChild(
                    card
                );

            }
        );


    }


    catch (error) {


        console.error(
            "Application loading error:",
            error
        );


        container.innerHTML = `

            <div class="error-card">

                <h2>
                    Unable to Load Applications
                </h2>

                <p>
                    Please check whether the
                    FastAPI backend server is running.
                </p>

            </div>

        `;

    }

}


loadApplications();


</script>


</body>

</html>
