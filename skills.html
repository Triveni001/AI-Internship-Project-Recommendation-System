<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Select Skills - AI Matcher</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="form-container">

    <h1>Select Your Skills</h1>

    <p>
        Choose the skills you already know.
    </p>

    <form>

        <label>
            <input type="checkbox" name="skill" value="python">
            Python
        </label>

        <label>
            <input type="checkbox" name="skill" value="java">
            Java
        </label>

        <label>
            <input type="checkbox" name="skill" value="javascript">
            JavaScript
        </label>

        <label>
            <input type="checkbox" name="skill" value="react">
            React
        </label>

        <label>
            <input type="checkbox" name="skill" value="html-css">
            HTML & CSS
        </label>

        <label>
            <input type="checkbox" name="skill" value="sql">
            SQL
        </label>

        <label>
            <input type="checkbox" name="skill" value="machine-learning">
            Machine Learning
        </label>

        <label>
            <input type="checkbox" name="skill" value="data-science">
            Data Science
        </label>

        <label>
            <input type="checkbox" name="skill" value="git">
            Git
        </label>

        <label>
            <input type="checkbox" name="skill" value="aws">
            AWS
        </label>

        <button
            type="button"
            class="btn"
            onclick="saveSkillsToBackend()">
            Continue
        </button>

    </form>

</div>

<script src="script.js"></script>

</body>

</html>
