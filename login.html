<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Login - AI Matcher</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="form-container">

    <h1>Student Login</h1>

    <p>
        Login to find your personalized opportunities.
    </p>


    <form>

        <label>Email</label>

        <input
            type="email"
            id="loginEmail"
            placeholder="Enter your email"
        >


        <label>Password</label>

        <input
            type="password"
            id="loginPassword"
            placeholder="Enter your password"
        >


        <button
            type="button"
            class="btn"
            onclick="loginWithBackend()"
        >
            Login
        </button>

    </form>


    <p>
        Don't have an account?
        <a href="register.html">Create Account</a>
    </p>

</div>


<script src="script.js"></script>

</body>

</html>
